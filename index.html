<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMD Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>AMD Converter</h2>

    <!-- BANK DROPDOWN -->
    <label>Bank:</label>
    <div class="bank-dropdown">
        <div id="bankSelected" class="bank-selected">
            <img id="bankSelectedLogo" class="bank-logo-small" src="icons/acba.png">
            <span id="bankSelectedName">Acba Bank</span>
        </div>

        <div id="bankList" class="bank-list hidden">
            <div class="bank-item" data-bank="Acba Bank">
                <img src="icons/acba.png" class="bank-logo-small"> Acba Bank
            </div>
            <div class="bank-item" data-bank="Ameriabank">
                <img src="icons/ameria.png" class="bank-logo-small"> Ameriabank
            </div>
            <div class="bank-item" data-bank="IDBank">
                <img src="icons/idbank.png" class="bank-logo-small"> IDBank
            </div>
            <div class="bank-item" data-bank="Fast Bank">
                <img src="icons/fastbank.png" class="bank-logo-small"> Fast Bank
            </div>
            <div class="bank-item" data-bank="Inecobank">
                <img src="icons/ineco.png" class="bank-logo-small"> Inecobank
            </div>
            <div class="bank-item" data-bank="Evocabank">
                <img src="icons/evoca.png" class="bank-logo-small"> Evocabank
            </div>
        </div>
    </div>

    <!-- CURRENCY PAIR -->
    <div class="currency-pair">

        <div class="currency-box">
            <label>From:</label>
            <div class="currency-select">
                <img id="flagFrom" class="flag-icon" src="icons/usd.png">
                <select id="currencyFrom">
                    <option value="USD" data-flag="icons/usd.png">USD</option>
                    <option value="EUR" data-flag="icons/eur.png">EUR</option>
                    <option value="AMD" data-flag="icons/amd.png">AMD</option>
                </select>
            </div>

            <input type="number" id="amountFrom" placeholder="Enter amount" class="no-spin">
        </div>

        <!-- REVERSE BUTTON -->
        <button id="reverseBtn" class="reverse-btn">⇄</button>

        <div class="currency-box">
            <label>To:</label>
            <div class="currency-select">
                <img id="flagTo" class="flag-icon" src="icons/amd.png">
                <select id="currencyTo">
                    <option value="AMD" data-flag="icons/amd.png">AMD</option>
                    <option value="USD" data-flag="icons/usd.png">USD</option>
                    <option value="EUR" data-flag="icons/eur.png">EUR</option>
                </select>
            </div>

            <div id="amountTo" class="result-text">0.00</div>
        </div>

    </div>

    <!-- RATES -->
    <div id="rates" class="rates-display"></div>

</div>

<script src="script.js"></script>
</body>
</html>
